aid: perimeterx
name: PerimeterX (HUMAN Security)
description: >-
  PerimeterX was a bot mitigation and application security company that in 2022 merged
  with White Ops to form HUMAN Security; the PerimeterX products (Bot Defender, Account
  Defender, Credential Intelligence, Code Defender) now ship under HUMAN's Applications
  Protection line, consolidated into the Sightline Cyberfraud Defense platform plus the
  newer AgenticTrust offering for monitoring and mitigating AI agents. HUMAN also runs an
  Advertising Protection line (MediaGuard, FraudSensor, Page Intelligence, Ad Click Defense,
  Malvertising Defense) for ad-fraud and invalid-traffic detection. Developers integrate via
  lightweight server-side and edge "Enforcer" SDKs, mobile SDKs, and REST APIs authenticated
  with Bearer server tokens, and can drive the platform from AI agents through HUMAN's
  official Model Context Protocol (MCP) server.

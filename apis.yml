apis:
- name: Applications Protection API
  description: >-
    REST API surface behind HUMAN's Applications Protection products (Account Defender,
    Bot Defender, Credential Intelligence, Code Defender / PCI DSS). Manage custom rules,
    custom lists, account information, feedback, client-side script inventory and incidents.
    Bearer-token authenticated; JSON request/response with a {result, message, content} envelope.
  humanURL: https://docs.humansecurity.com/applications/reference/about-the-applications-api

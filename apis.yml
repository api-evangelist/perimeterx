- name: MediaGuard API
  description: >-
    Advertising Protection pre-bid API — HTTP lookup and health-check endpoints returning
    real-time invalid-traffic (IVT) predictions on bid requests so buyers can filter fraud
    before impressions are served.
  humanURL: https://docs.humansecurity.com/advertising/reference/about-the-mediaguard-api
- name: Reporting API
  description: >-
    Advertising Protection reporting API — download generated report files that mirror the
    HUMAN dashboard reporting for MediaGuard, FraudSensor, Click Defense and Page Intelligence.
  humanURL: https://docs.humansecurity.com/advertising/reference/about-the-reporting-api
